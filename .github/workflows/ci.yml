name: SearchLens AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: searchlens
          POSTGRES_PASSWORD: searchlens
          POSTGRES_DB: searchlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Run Pytest
      env:
        DATABASE_URL: postgresql+psycopg2://searchlens:searchlens@localhost:5432/searchlens
      run: |
        cd backend
        python -m pytest tests/ -v
        
  build-docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build backend
      run: docker build -t searchlens-backend ./backend
    - name: Build frontend
      run: docker build -t searchlens-frontend ./frontend
